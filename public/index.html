<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Content Security Policy. The app only ever talks to Supabase (auth, data,
      Edge Function gateway) and the Aureus POS hosts; every other vendor is
      reached through the gateway. localhost/ws entries keep `expo start --web`
      (Metro HMR) working and are harmless in production. Do not add
      upgrade-insecure-requests: Safari rewrites http://localhost to https and
      Metro cannot serve that, so the page stays blank. Production already
      enforces HTTPS via HSTS.

      'unsafe-eval' is development only: the Metro dev server delivers the
      lazily loaded screens with fetch + eval, so without it opening any app
      fails. scripts/fix-web-export.js removes it from the exported
      dist/index.html (production loads chunks with plain script tags) and
      scripts/check-bundle-secrets.js refuses to ship if it is still present.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self' https://app.rippling.com;
        script-src 'self' 'unsafe-eval' http://localhost:* http://127.0.0.1:*;
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        img-src 'self' data: blob: https:;
        media-src 'self' blob:;
        worker-src 'self' blob:;
        connect-src 'self' blob: data:
          https://bkvyyddtevzvuanzkobd.supabase.co wss://bkvyyddtevzvuanzkobd.supabase.co
          https://canadagoldeast.aureuspos.com https://gta.aureuspos.com https://canadianpmx.com
          wss://*.ringcentral.com wss://*.ringcentral.com:8083 https://*.ringcentral.com
          http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*;"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>%WEB_TITLE%</title>
    <!--
      Open the TLS connections the app needs the moment it boots (session
      restore hits Supabase, then the Aureus POS) so those handshakes overlap
      with the JavaScript download instead of following it.
    -->
    <link rel="preconnect" href="https://bkvyyddtevzvuanzkobd.supabase.co" crossorigin />
    <link rel="preconnect" href="https://canadagoldeast.aureuspos.com" crossorigin />
    <!--
      Fonts that gate the first paint. Preloading lets them download alongside
      the bundle rather than after it has been parsed and run. The large icon
      sets (Material Community, Feather) are deliberately not here; the app
      fetches them in the background.
    -->
    <link rel="preload" href="/fonts/Sohne-Buch.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/Sohne-Leicht.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/SohneMono-Buch.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/Ionicons.ttf" as="font" type="font/ttf" crossorigin />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <!--
      No @font-face rules here: expo-font registers every family from App.js
      (against the preloaded files above). Declaring them twice made the
      browser fetch each font twice.
    -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        font-family: Sohne, sans-serif;
      }
      body {
        overflow: hidden;
      }
      input,
      textarea,
      button,
      select {
        font-family: Sohne, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        Boot spinner. Drawn by the browser as soon as the HTML arrives, so the
        page is never blank while the bundle downloads. It mirrors the app's
        ActivityIndicator (same geometry, colour and speed) and React replaces
        it on first render, so the hand-off is invisible.
      */
      .cgold-boot {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      .cgold-boot svg {
        width: 20px;
        height: 20px;
        animation: cgold-boot-spin 0.75s linear infinite;
      }
      @keyframes cgold-boot-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cgold-boot svg {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="cgold-boot" role="status" aria-label="Loading">
        <svg viewBox="0 0 32 32" fill="none" stroke="#1a1a1a" stroke-width="4">
          <circle cx="16" cy="16" r="14" opacity="0.2"></circle>
          <circle cx="16" cy="16" r="14" stroke-dasharray="80" stroke-dashoffset="60"></circle>
        </svg>
      </div>
    </div>
  </body>
</html>
