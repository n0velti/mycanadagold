<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!--
      Content Security Policy. The app only ever talks to Supabase (auth, data,
      Edge Function gateway) and the Aureus POS hosts; every other vendor is
      reached through the gateway. localhost/ws entries keep `expo start --web`
      (Metro HMR) working and are harmless in production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self' https://app.rippling.com;
        script-src 'self' http://localhost:* http://127.0.0.1:*;
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        img-src 'self' data: blob: https:;
        media-src 'self' blob:;
        worker-src 'self' blob:;
        connect-src 'self'
          https://bkvyyddtevzvuanzkobd.supabase.co wss://bkvyyddtevzvuanzkobd.supabase.co
          https://canadagoldeast.aureuspos.com https://gta.aureuspos.com https://canadianpmx.com
          http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*;
        upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      @font-face {
        font-family: Sohne;
        src: url('/fonts/Sohne-Buch.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: SohneLeicht;
        src: url('/fonts/Sohne-Leicht.otf') format('opentype');
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: ionicons;
        src: url('/fonts/Ionicons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: material-community;
        src: url('/fonts/MaterialCommunityIcons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      html,
      body {
        height: 100%;
        font-family: Sohne, sans-serif;
      }
      body {
        overflow: hidden;
      }
      input,
      textarea,
      button,
      select {
        font-family: Sohne, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
